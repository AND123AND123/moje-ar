<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Laboratorium AR - Projekt Studencki</title>
    
    <!-- Prawidłowy, pancerny import A-Frame z cdnjs -->
    <script src="https://cloudflare.com"></script>
    
    <!-- Prawidłowy, oficjalny import AR.js z jsdelivr (zamiast githack) -->
    <script src="https://jsdelivr.net"></script>
  </head>
  
  <body style="margin: 0px; overflow: hidden;">
    <!-- Inicjalizacja sceny AR -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" renderer="colorManagement: true;">
      
      <!-- Sekcja ASSETS -->
      <a-assets>
        <a-asset-item id="moj-model" src="model.glb"></a-asset-item>
      </a-assets>

      <!-- Wyzwalacz: uniwersalny znacznik HIRO -->
      <a-marker preset="hiro">
        <a-gltf-model 
          src="#moj-model" 
          position="0 0.5 0" 
          scale="0.2 0.2 0.2"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 8000">
        </a-gltf-model>
      </a-marker>
      
      <!-- Wirtualna kamera -->
      
      
    </a-scene>
  </body>
</html>
