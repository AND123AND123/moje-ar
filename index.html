<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Laboratorium AR - Projekt Studencki</title>
    <!-- Import bibliotek AR bezpośrednio z bezpiecznej chmury CDN -->
    <script src="https://aframe.io"></script>
    <script src="https://githack.com"></script>
  </head>
  
  <body style="margin: 0px; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" renderer="colorManagement: true;">
      
      <!-- Sekcja ASSETS: Serwer pobiera plik model.glb z tego samego folderu GitHub -->
      <a-assets>
        <a-asset-item id="moj-model" src="model.glb"></a-asset-item>
      </a-assets>

      <!-- Wyzwalacz sceny: ustawiony na uniwersalny wzorzec (preset="hiro") -->
      <a-marker preset="hiro">
        <!-- Wyświetlenie i animacja modelu 3D pobranego ze Spline -->
        <a-gltf-model 
          src="#moj-model" 
          position="0 0.5 0" 
          scale="0.2 0.2 0.2"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 8000">
        </a-gltf-model>
      </a-marker>
      
      <!-- Wirtualne oświetlenie, aby model zachował kolory ze Spline -->
      
      

      
    </a-scene>
  </body>
</html>
