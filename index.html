<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Laboratorium AR - Moj Projekt</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0px; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" renderer="colorManagement: true;">
        <a-assets>
            <a-asset-item id="moj-model" src="model.glb"></a-asset-item>
        </a-assets>
        <a-marker type="pattern" url="marker.patt">
            <a-gltf-model src="#moj-model" position="0 0 0" scale="1 1 1" animation="property: rotation; to: 0 360 0; loop: true; dur: 8000"></a-gltf-model>
        </a-marker>
        <a-light type="ambient" color="#ffffff" intensity="0.8"></a-light>
        <a-light type="directional" color="#ffffff" intensity="0.5" position="-1 2 1"></a-light>
        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
